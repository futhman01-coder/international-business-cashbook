
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>International Business Cashbook</title>
  <style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f3f6fa;
  color: #243247;
}

header {
  background: #173b68;
  color: white;
  padding: 22px 16px;
}

header h1 {
  font-size: 22px;
  margin-bottom: 6px;
}

header p {
  font-size: 13px;
  opacity: 0.9;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 20px 15px;
}

.dashboard {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.card h3 {
  font-size: 13px;
  color: #64748b;
  margin-bottom: 12px;
}

.card h2 {
  font-size: 23px;
  color: #173b68;
}

.section {
  margin-top: 25px;
}

.section h2 {
  font-size: 18px;
  margin-bottom: 14px;
  color: #173b68;
}

@media (max-width: 480px) {
  .dashboard {
    grid-template-columns: 1fr;
  }
}
  </style>
</head>
<body>
<header>
  <h1>Business Cashbook</h1>
  <p>International Business Cashbook & Profit Tracker</p>
</header>

<main>
  <section class="dashboard">

    <div class="card">
      <h3>Total Income</h3>
      <h2 id="income">$0.00</h2>
    </div>

    <div class="card">
      <h3>Total Expenses</h3>
      <h2 id="expenses">$0.00</h2>
    </div>

    <div class="card">
      <h3>Net Profit</h3>
      <h2 id="profit">$0.00</h2>
    </div>

    <div class="card">
      <h3>Available Balance</h3>
      <h2 id="balance">$0.00</h2>
    </div>

  </section>
  </main>
  <section class="section">
  <div class="card">
    <h2>Record a Transaction</h2>

    <label>Transaction Type</label>
    <select id="type">
      <option value="income">Income</option>
      <option value="expense">Expense</option>
    </select>

    <label>Description</label>
    <input type="text" id="description"
      placeholder="What was the transaction for?">

    <label>Amount</label>
    <input type="number" id="amount"
      placeholder="Enter amount">

    <label>Date</label>
    <input type="date" id="date">

    <button type="button" onclick="addTransaction()">
      Save Transaction
    </button>
  </div>
  </section>
  <section class="section">
  <div class="card">
    <h2>Transaction History</h2>

    <div style="overflow-x:auto;">
      <table style="width:100%; border-collapse:collapse;">
        <thead>
          <tr>
            <th style="padding:10px; text-align:left;">Date</th>
            <th style="padding:10px; text-align:left;">Description</th>
            <th style="padding:10px; text-align:left;">Type</th>
            <th style="padding:10px; text-align:left;">Amount</th>
          </tr>
        </thead>

        <tbody id="transactionList">
          <tr>
            <td colspan="4" style="padding:12px;">
              No transactions recorded yet.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  </section>
</body>
  </html>
